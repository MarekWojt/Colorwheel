loom {
    // 26.1 access widener (shared by the fabric module and declared in fabric.mod.json).
    accessWidenerPath = file("src/main/resources/colorwheel.classtweaker")
}

dependencies {
    // Fabric Loader provides the @Environment annotations used across the loader-agnostic core.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Flywheel, Ponder and Catnip are bundled inside Create-Fly (com.zurrtum.create.*) for 26.1.
    // 26.1 is unobfuscated, so these are plain (non-remapped) compile dependencies.
    compileOnly "maven.modrinth:create-fly:${create_fly_version}"
    compileOnly "maven.modrinth:iris:${iris_version}"
    compileOnly "maven.modrinth:sodium:${sodium_version}"

    compileOnly "io.github.douira:glsl-transformer:${glsl_transformer_version}"
}
