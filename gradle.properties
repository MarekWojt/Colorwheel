# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod properties
mod_version = 1.0.0
maven_group = dev.djefrey.colorwheel
archives_name = colorwheel
# NeoForge is kept in the source tree as a future basis (Create-NeoForge for 26.x does
# not exist yet). Only Fabric is part of the active build.
enabled_platforms = fabric

# Minecraft properties
minecraft_version = 26.1.2

# Build tooling
# architectury-loom does not support unobfuscated 26.1 yet (architectury/architectury-loom#328),
# so the build uses plain Fabric Loom. The common/fabric/neoforge module split is kept; the
# cross-loader abstraction is Colorwheel's own ServiceLoader (ClrwlXplat), not Architectury.
loom_version = 1.16-SNAPSHOT

# Dependencies
fabric_loader_version = 0.19.2
fabric_api_version = 0.148.2+26.1.2

# Build dependency mod versions
# Flywheel, Ponder and Catnip are bundled inside Create-Fly (com.zurrtum.create) for 26.1.
create_fly_version = 26.1.2-6.0.9-1
sodium_version = mc26.1.2-0.8.12-beta.2-fabric
iris_version = 1.10.9+26.1-fabric
glsl_transformer_version = 2.0.1
jcpp_version = 1.4.14

