pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'Colorwheel'

include 'common'
include 'fabric'
// 'neoforge' is intentionally not included: there is no Create-NeoForge for 26.x to
// compile against yet. The module is kept in the tree as a future basis. Re-add it here
// (and set enabled_platforms = fabric,neoforge) once a 26.x NeoForge backend exists.
// include 'neoforge'
