plugins {
    id 'idea'
    // architectury-loom has no Minecraft 26.1 support yet (architectury/architectury-loom#328).
    // 26.1 is unobfuscated, so plain Fabric Loom is used in its no-remap mode.
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version + "+mc" + rootProject.minecraft_version
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `colorwheel-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url = "https://api.modrinth.com/maven" }   // Create-Fly, Iris, Sodium
        maven { url = "https://maven.createmod.net" }       // Create / Catnip / Ponder family
        maven { url = 'https://maven.blamejared.com' }      // misc
    }

    dependencies {
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
        // Minecraft 26.1 is unobfuscated and ships parameter names: no mappings dependency
        // is declared (and none is published for 26.x).
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build"
        // task if it is present.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.compilerArgs.addAll(['-Xmaxerrs', '2000', '-Xmaxwarns', '2000'])
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // Add repositories to publish to here.
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
